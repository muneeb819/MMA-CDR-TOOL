[package]
name = "cdr_refinery"
version = "2.0.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
sha2 = "0.10"
dashmap = "6.1"
tracing = "0.1"
tracing-subscriber = "0.3"
